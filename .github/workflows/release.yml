# Publish Vimny to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC): GitHub mints a short-lived credential for
# this specific workflow at run time. There is NO API token and NO secret stored
# anywhere in this repo or its settings — nothing to leak, rotate, or paste.
# Setup is a one-time registration on PyPI; see packaging/README.md.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The build runs first and the publish job only starts if the tests pass, so a
# broken tag costs you a red run rather than a bad release. PyPI does not allow
# re-uploading a version, so this is worth keeping in that order.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # lets you rehearse the build without tagging

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine pytest

      - name: Install Vimny and its real dependency set
        run: python -m pip install .

      - name: Run the suite
        run: python -m pytest -q

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG" >&2
            exit 1
          fi
          echo "Tag and pyproject agree on $PKG"

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Validate the artifacts
        run: |
          python -m twine check dist/*
          # The wheel must claim exactly one top-level name.
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = {n.split('/')[0] for n in zipfile.ZipFile(whl).namelist()
                   if not n.startswith('vimny-')}
          assert names == {'vimny'}, f'wheel claims unexpected names: {names}'
          print('wheel claims exactly:', names)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Must match the environment named in the PyPI trusted-publisher config.
    environment:
      name: pypi
      url: https://pypi.org/p/vimny

    permissions:
      id-token: write        # REQUIRED for OIDC. Without it the mint fails.

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
