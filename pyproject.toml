[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name            = "vimny"
version         = "1.0.1"
description     = "A TUI dungeon crawler that teaches Vim through play."
readme          = "README.md"
requires-python = ">=3.9"
license         = { text = "GPL-3.0-or-later" }
authors         = [{ name = "Chas Kissick" }]
keywords        = ["vim", "game", "dungeon-crawler", "tui", "teaching"]
# Don't pin wcwidth<0.8 to save its ~5 MB of Unicode tables: blessed 1.45+
# requires wcwidth>=0.8.1, so the pin silently freezes blessed at 1.44 and
# forfeits its terminal-compatibility fixes. See packaging/README.md.
dependencies    = ["blessed"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Education",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
Homepage      = "https://github.com/chkiss/Vimny"
Repository    = "https://github.com/chkiss/Vimny"
Issues        = "https://github.com/chkiss/Vimny/issues"
"Level shelf" = "https://github.com/chkiss/vimny-levels"

[project.scripts]
vimny = "vimny.game:main"

[tool.setuptools]
# Vimny runs from a checkout (`python main.py`); the package list is here so an
# install is possible and `pip install .` does something sensible rather than
# failing.
#
# AN INSTALL CLAIMS EXACTLY ONE NAME: `vimny`. It used to claim nine — eight
# top-level packages (`engine`, `save`, `render` and friends) plus, via
# py-modules, a bare module called `main`, which is about the worst name in the
# language to squat. The game loop is `vimny/game.py` now; the root `main.py`
# is a launcher that is deliberately NOT packaged, so `python3 main.py` still
# works from a checkout without that name ever reaching site-packages.
packages   = [
    "vimny", "vimny.engine", "vimny.generation", "vimny.content",
    "vimny.render", "vimny.save", "vimny.art", "vimny.sharing",
]

[tool.setuptools.package-data]
"vimny.render" = ["*.md"]
"vimny.art"    = ["*.txt"]

[tool.vulture]
# Dead-code detection.  Install once:  python -m pip install vulture
# Run:                                  python -m vulture
#
# Vulture is static, so it cannot see anything resolved dynamically (getattr /
# slug dispatch).  The ignore_names globs below suppress those known false
# positives so a clean run means a *real* dead-code finding.  See the
# "Dead-code detection" note in docs/ARCHITECTURE.md.
paths = ["vimny/engine", "vimny/generation", "vimny/content", "vimny/render", "vimny/game.py"]
min_confidence = 60
ignore_names = [
    "build_dungeon_*",   # resolved via getattr(module, f'build_dungeon_{slug}')
    "_par_*",            # par-solvers resolved by slug alongside their builders
    "expl_*",            # color fns discovered via getattr over dir(render.colors) in render/color_palette.py
    "SAFE",              # RoomType.SAFE — constructed only by test fixtures (tests/ isn't scanned)
]
